name: Build Android APK

on:
  push:
    branches:
      - android
    # triggered from
    paths:
      - 'frontend/android/**'
      - '.github/workflows/build-apk.yml'

# Tambahkan bagian ini agar bot bisa membuat Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # setup JDK
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with: 
          distribution: 'zulu'
          java-version: '17'

      # setup SDK
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # write env
      - name: Create .env from secrets
        working-directory: ./frontend/android
        env:
          ENV_SECRET: ${{ secrets.ANDROID_ENV }} 
        run:
          echo "$ENV_SECRET" > .env

      # decode release keystore for APK signing (debug fallback if secrets missing)
      - name: Setup Release Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: ./frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/keystores
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystores/hidocs-release.jks
          printf 'storeFile=/tmp/keystores/hidocs-release.jks\n' > android/keystore.properties
          printf 'storePassword=%s\n' "${{ secrets.KEYSTORE_STORE_PASSWORD }}" >> android/keystore.properties
          printf 'keyAlias=%s\n' "${{ secrets.KEYSTORE_KEY_ALIAS }}" >> android/keystore.properties
          printf 'keyPassword=%s\n' "${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> android/keystore.properties

      - name: Keystore signing info
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: echo "⚠️ No keystore secret found — APK will be debug-signed"

      # go to /frontend & install dependencies
      - name: Install Dependencies
        working-directory: ./frontend/android
        run : flutter pub get
      
      # error analyze
      - name: Code analyze
        id: analyze
        working-directory: ./frontend/android
        run : flutter analyze

      # handling error
      - name: Handling error
        if: failure() && steps.analyze.outcome == 'failure'
        run: |
          echo "Bug found when analyze the code"
          echo "Build canceled"

      # build apk
      - name: Build APK
        if: success()
        working-directory: ./frontend/android
        run : |
          flutter build apk --release --build-number=${{ github.run_number }}

      # Upload Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: frontend/android/build/app/outputs/flutter-apk/app-release.apk

      # Create GitHub Release secara otomatis setiap push ke branch android
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release Build
          body: |
            Otomatis dibuat dari commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: frontend/android/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                