info:
  contact:
    email: support@hidocs.id
    name: HiDocs Support
  description: High-performance backend API for HiDocs Form & Exam Maker application
    using Golang and Domain-Driven Design (DDD).
  termsOfService: http://swagger.io/terms/
  title: HiDocs Backend API (Form & Exam Maker)
  version: "1.0"
paths:
  /api/v1/admin/creators:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CreatorResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List form creators/users
      tags:
      - Admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Create Creator Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
