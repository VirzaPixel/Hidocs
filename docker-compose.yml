version: '3.8'

services:
  # Service Backend Golang
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${APP_HOST_PORT:-8089}:${APP_PORT:-8080}"
    env_file:
      - .env
    depends_on:
      - postgres-db
      - redis
    restart: always

  # Service Redis — dipakai OTP cache + whitelist refresh token JWT.
  # Tanpa ini backend otomatis fallback ke cache in-memory: OTP/refresh token
  # hanya hidup di 1 proses dan hilang setiap container di-restart.
  # Pastikan REDIS_HOST=redis di .env saat memakai compose ini.
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6389}:6379"
    restart: always

  # Service Frontend Web React
  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${WEB_HOST_PORT:-8088}:${WEB_PORT:-80}"
    restart: always

  # Service PostgreSQL Hidocs
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_HOST_PORT:-5439}:${DB_PORT:-5432}"
    volumes:
      - hidocs_postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  hidocs_postgres_data:
